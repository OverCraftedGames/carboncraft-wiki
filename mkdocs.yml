site_name: OCG Survival Wiki
site_description: Player guide for OCG Survival, the survival server on OCG Network
site_url: https://wiki.carboncraft.xyz/
copyright: OCG Survival is part of <a href="https://minecraft.ocgames.xyz/">OCG Network</a> by <a href="https://ocgames.xyz">OverCrafted Games</a>.

nav:
  - Home: index.md
  - Links: links.md
  - About: about.md
  - Getting started:
      - getting-started/index.md
      - Joining the server: getting-started/joining.md
      - Your first hour: getting-started/first-steps.md
      - Claiming land: getting-started/claiming-land.md
      - Money & currencies: getting-started/money.md
      - Voting & vote tiers: getting-started/voting.md
      - Inviting friends: getting-started/inviting-friends.md
      - Commands: getting-started/commands.md
      - Rules: getting-started/rules.md
  - Mining & fishing:
      - activities/index.md
      - Mining: activities/mining.md
      - Fishing: activities/fishing.md
  - Skills:
      - skills/index.md
      - Stats & effects: skills/stats-and-effects.md
      - Earning XP: skills/earning-xp.md
  - The Syndicate:
      - syndicates/index.md
      - CarbonCorp™: syndicates/carboncorp.md
      - ISD: syndicates/isd.md
      - The Union: syndicates/union.md
      - Vivec's Rebels: syndicates/rebels.md
  - Cosmetics:
      - cosmetics/index.md
      - Tags: cosmetics/tags.md
      - Join messages: cosmetics/join-messages.md
      - Plushies: cosmetics/plushies.md
      - Collector's Codex: cosmetics/codex.md
  - Store rewards:
      - store/index.md
      - Monthly rewards: store/monthly-rewards.md
      - Supporter of the Month: store/supporter-of-the-month.md

validation:
  anchors: warn

hooks:
  - hooks/strip_comments.py

theme:
  name: material
  logo: assets/ocg-logo.png
  favicon: assets/ocg-favicon.png
  # Dark only, matching the OCG Network site. Fonts load from ocg-survival.css.
  palette:
    scheme: slate
    primary: custom
    accent: custom
  font: false
  features:
    - navigation.instant
    - navigation.sections
    - navigation.footer
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - toc.follow

extra_css:
  - assets/ocg-survival.css?v=4   # bump v on every CSS change so browsers reload it

extra:
  generator: false
  social:
    - icon: fontawesome/brands/discord
      link: https://discord.gg/carboncraft
      name: OCG Network Discord
    - icon: material/store
      link: https://minecraft.ocgames.xyz/store.html
      name: OCG Network store
    - icon: fontawesome/brands/instagram
      link: https://www.instagram.com/carboncraftxyz/
      name: Instagram
    - icon: material/web
      link: https://minecraft.ocgames.xyz/
      name: OCG Network

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
